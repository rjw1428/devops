set -g mouse on


set -g mode-keys vi
unbind C-b
set-option -g prefix C-Space 	# set's the prefix

# Reload tmux config shortcut
bind-key -r r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Start window indexing at 1 instead of 0
set -g base-index 1
set-option -g renumber-windows on

# Panel Splitting
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Kill pane without confirmation
unbind-key x
bind-key x kill-pane
bind-key X kill-session

# Pane vim style movements
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r l select-pane -R
bind-key -r k select-pane -U

# Pane vim style resizing
bind-key -r H resize-pane -L 4
bind-key -r J resize-pane -D 4
bind-key -r K resize-pane -U 4
bind-key -r L resize-pane -R 4

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# Highlights active pane better
set -g default-terminal "screen-256color"
set-window-option -g pane-border-style fg=colour11,bg=colour234
set-window-option -g pane-active-border-style fg=colour118,bg=colour234
set-window-option -g window-style fg=white,bg=colour236
set-window-option -g window-active-style fg=white,bg=colour235

# Status Bar
set-option -g status-position top
set-option -g status-style "default" 
set-option -g status-justify absolute-centre
set-window-option -g window-status-style fg=colour11
set-window-option -g window-status-current-style fg=white,bold
set-window-option -g window-status-last-style "default" 
set-window-option -g window-status-separator |

# Left Side
# Show my active session, window, pane name or id  
set-option -g status-left-length 50   # default 10
#set-option -g status-left "[#[fg=white]S: #S, #[fg=colour11]W #I-#W, #[fg=colour3]P: #P #[fg=white]]"
#set-option -g status-left-style

# Right Side
set-option -g status-right-length 80   # default 50
#set-option -g status-right "#[fg=grey,dim,bg=default] %H:%M %d-%b-%y uptime: #(uptime | cut -d\" \" -f 4-8 | cut -d\",\" -f 1-2)"
set-option -g status-right "#[fg=grey,dim,bg=default] %H:%M%p %d-%b-%y #(~/TestProjects/scripts/train.sh -s)"
set -g status-interval 120

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-boot 'on'  
set -g @continuum-boot-options 'fullscreen'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# run-shell "mkdir -p ~/.tmux/plugins/"
# run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"
run '~/.tmux/plugins/tpm/tpm'
